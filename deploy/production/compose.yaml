name: atethat-production

services:
  caddy:
    image: caddy:2.10-alpine
    env_file:
      - path: .env
        required: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    restart: unless-stopped
    mem_limit: 128m
    logging: &default_logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      CORE_GRPC_ADDR: core:9090
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_CIDRS: 172.28.0.0/24
    depends_on:
      core:
        condition: service_healthy
    networks: [edge, private]
    restart: unless-stopped
    mem_limit: 512m
    logging: *default_logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  core:
    build:
      context: ../..
      dockerfile: services/core/Dockerfile
    env_file:
      - path: .env
        required: true
    # `private` keeps gRPC reachable only from API. `egress` permits Core to
    # resolve and call external services such as Atlas, SMTP, Google, and USDA.
    # It publishes no host ports, so Core remains unreachable from the internet.
    networks: [private, egress]
    # Docker cannot use the host's loopback systemd-resolved listener
    # (127.0.0.53). Core needs public DNS for Atlas SRV, SMTP, Google, and USDA.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    restart: unless-stopped
    mem_limit: 512m
    logging: *default_logging
    # Core is a gRPC-only process. API startup blocks on a real gRPC connection;
    # this probe only confirms that the long-running Core process is still alive.
    healthcheck:
      test: ["CMD-SHELL", "test -e /proc/1/exe"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  egress:

volumes:
  caddy_data:
  caddy_config:
