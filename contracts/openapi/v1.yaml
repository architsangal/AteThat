openapi: 3.0.3
info:
  title: AteThat API
  version: 0.1.0
  description: |
    Executable contract for identity, profile, preferences, Tracking Day, and nutrition targets.
    The complete Phase 1 route inventory remains in docs/5. API_DESIGN.md until formalized here.
    All persisted instants are UTC. Browser access tokens stay in memory; refresh tokens
    are carried only in a Secure, HttpOnly, SameSite=Lax cookie outside local development.
servers:
  - url: http://localhost:18080/api/v1
    description: Local API service (when implemented)
tags:
  - name: Identity
  - name: Profile
  - name: Preferences
  - name: TrackingDay
  - name: NutritionTargets
  - name: Foods
security:
  - bearerAuth: []
paths:
  /wellness/maintenance:
    get:
      tags: [Wellness]
      operationId: getMaintenance
      summary: Get owner-scoped maintenance estimate and immutable baseline history
      responses:
        '200':
          description: Profile estimate, effective inputs, saved revisions and current Tracking Day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenancePlan' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Wellness]
      operationId: saveMaintenance
      summary: Save a reviewed manual or calculated maintenance baseline
      description: First baseline starts today; subsequent revisions start next Tracking Day. Existing food targets are unchanged. Version is shared with water settings. Calculated mode requires the current profile version and exact suggested value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, kcal, mode]
              properties:
                version: { type: integer, minimum: 0 }
                kcal: { type: string, maxLength: 32 }
                mode: { type: string, enum: [MANUAL, CALCULATED] }
                profile_version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated maintenance plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenancePlan' }
        default: { $ref: '#/components/responses/Problem' }
  /wellness/analysis:
    get:
      tags: [Wellness]
      operationId: dailyWellness
      summary: Owner-scoped daily maintenance, food, workout, deficit and water totals
      description: Inclusive saved Tracking Day range, maximum 366 days. Empty decimal strings mean unknown or unavailable, never inferred zero. Deficit equals effective maintenance plus additional logged workout calories minus known recorded food calories. A workout without calories makes the deficit unavailable. No workout records means zero additional logged workout calories. Water goal is current, not historical.
      parameters:
        - { name: from_tracking_day, in: query, required: true, schema: { type: string, format: date } }
        - { name: to_tracking_day, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Daily wellness values
          content:
            application/json:
              schema:
                type: object
                required: [items, water_target_ml]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DailyWellness' } }
                  water_target_ml: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /health-items/occurrences:
    get:
      tags: [Health]
      operationId: listHealthOccurrences
      summary: Owner-scoped effective scheduled occurrences, including moved occurrences
      description: Range is UTC and end-exclusive, at most 32 elapsed days. UI converts up to 31 account calendar days, allowing DST. Apply effective moved dates and event state before sorting/pagination. Stable signed occurrence identity is retained across moves.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Effective occurrences
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HealthOccurrence' } }
                  page:
                    type: object
                    properties:
                      next_cursor: { type: string, nullable: true }
                      has_more: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }
  /health-items/occurrences/{id}:
    put:
      tags: [Health]
      operationId: recordHealthOccurrence
      summary: Record completion, deliberate skip or a future one-off move
      description: RESCHEDULED is an action returning SCHEDULED, not a terminal lifecycle state. A move cannot target the past or a completed occurrence. Completion/skip retain a prior moved date. Audit snapshot and current state are written transactionally. Send expected_event_version for stale-action protection (omission retained for older clients); conflicts are 409.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 512 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [TAKEN, SKIPPED, RESCHEDULED] }
                completed_at: { type: string, format: date-time, description: Required only for TAKEN }
                rescheduled_to: { type: string, format: date-time, description: Required only for RESCHEDULED; future instant }
                expected_event_version: { type: integer, minimum: 0 }
                notes: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Updated effective occurrence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthOccurrence' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/proposal:
    post:
      tags: [NutritionTargets]
      operationId: proposeCalculatedTargets
      summary: Idempotent initial calculated proposal; never replaces accepted targets
      responses:
        '200':
          description: Current profile-bound PROPOSED or previously REJECTED proposal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/custom/review:
    post:
      tags: [NutritionTargets]
      operationId: reviewCustomTargets
      summary: Read-only applicable adult range warnings and signed confirmation token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveCustomTargetsRequest' }
      responses:
        '200':
          description: Only new or changed outside-reference confirmations; no target writes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomTargetsReview' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/planning:
    get:
      tags: [NutritionTargets]
      operationId: getTargetPlanningPolicy
      summary: Effective profile inputs, calculated-default preview and explicit assumptions
      responses:
        '200':
          description: Owner-specific calculated defaults, preview fingerprint and unavailable reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetPlanning' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [NutritionTargets]
      operationId: calculateSelectedMacroCalories
      summary: Exact 4/4/9 arithmetic only; does not save or recalculate food energy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [macros]
              additionalProperties: false
              properties:
                macros:
                  type: object
                  required: [PROTEIN, CARBOHYDRATE, FAT]
                  additionalProperties: false
                  properties:
                    PROTEIN: { $ref: '#/components/schemas/Decimal' }
                    CARBOHYDRATE: { $ref: '#/components/schemas/Decimal' }
                    FAT: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200':
          description: Policy plus exact macro_calories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetPlanning' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/reset:
    post:
      tags: [NutritionTargets]
      operationId: resetCalculatedNutritionTargets
      summary: Confirm a calculated-default preview as a new accepted revision
      description: Server recomputes from owner profile within the transaction and verifies the preview fingerprint, profile version and active target ID/revision. Replaces all five nutrition targets only; water, measurements and food logs are unchanged. Missing age/sex or unsupported adult scope cannot use this calculation. Stale previews fail without writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_active_id, expected_revision, profile_version, preview_token, adult_scope_confirmed]
              properties:
                expected_active_id: { type: string }
                expected_revision: { type: integer, minimum: 0 }
                profile_version: { type: integer, minimum: 1 }
                preview_token: { type: string, minLength: 64, maxLength: 64 }
                adult_scope_confirmed: { type: boolean, enum: [true] }
      responses:
        '201':
          description: New calculated target revision; previous active revision is superseded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/custom:
    post:
      tags: [NutritionTargets]
      operationId: saveSelectedNutritionTargets
      summary: Atomic new accepted revision changing only selected fields
      description: Requires matching current target ID/revision and profile version. Initial manual sets require all five values. Energy must be positive, other fields nonnegative; canonical decimal strings at most 32 characters and Decimal128-representable. Does not update water, profile, or logs. Point FDA references are metadata, not invented ranges.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveCustomTargetsRequest' }
      responses:
        '201':
          description: New accepted target revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /text-summary:
    get:
      operationId: getFactualTextSummary
      summary: Owner-only deterministic factual health and nutrition text; never persisted or sent to AI
      description: At most 366 inclusive days. All source pages are read up to explicit 10,000-row bounds. DAY health uses local calendar bounds and RANGE uses UTC bounds, independently of nutrition Tracking Days. Unavailable/compacted/unknown data are explicitly labelled. Names and configured dose are included; identity fields, free notes and instructions are excluded.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: mode, in: query, required: true, schema: { type: string, enum: [DAY, RANGE] } }
        - { name: nutrient, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Factual text with explicit context and partial-data flag
          content:
            application/json:
              schema:
                type: object
                required: [text, context, generated_at, partial]
                properties:
                  text: { type: string }
                  context: { type: string }
                  generated_at: { $ref: '#/components/schemas/UtcInstant' }
                  partial: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [Identity]
      operationId: register
      summary: Register an email-and-password account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Generic, enumeration-resistant acknowledgment
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMessage' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/verify-email:
    post:
      tags: [Identity]
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Email verified
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyEmailResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/resend-verification:
    post:
      tags: [Identity]
      operationId: resendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202':
          description: Generic, enumeration-resistant acknowledgment
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMessage' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session created; refresh token is set in HttpOnly cookie
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Set-Cookie:
              description: Rotated refresh cookie; never contains the access token
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/google/start:
    get:
      tags: [Identity]
      operationId: startGoogleSignIn
      summary: Start backend-managed Google OAuth with PKCE and one-time state
      security: []
      parameters:
        - name: return_to
          in: query
          required: true
          schema: { type: string, enum: [/app, /app/settings] }
      responses:
        '302':
          description: Redirect to Google authorization endpoint
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Location: { schema: { type: string, format: uri } }
        default: { $ref: '#/components/responses/Problem' }
  /auth/google/callback:
    get:
      tags: [Identity]
      operationId: completeGoogleSignIn
      summary: Consume one-time state, validate Google ID token, create AteThat session
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to an allowed frontend path, with refresh cookie on success
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
  /account/identities/google/link/start:
    get:
      tags: [Identity]
      operationId: startGoogleLink
      summary: Start explicit Google identity linking for an authenticated account
      responses:
        '200':
          description: One-time Google authorization URL
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorization_url]
                properties:
                  authorization_url: { type: string, format: uri }
        default: { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [Identity]
      operationId: refreshSession
      summary: Rotate refresh cookie and return a new short-lived access token
      description: The implementation must validate the configured frontend origin and enforce CSRF protection appropriate to its cookie deployment.
      security: []
      responses:
        '200':
          description: Session refreshed
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Set-Cookie:
              description: Rotated HttpOnly refresh cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      description: Accepts a valid bearer token or refresh cookie and clears the current session family.
      security:
        - bearerAuth: []
        - {}
      responses:
        '204':
          description: Session revoked or already absent; refresh cookie cleared
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/forgot-password:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202':
          description: Generic, enumeration-resistant acknowledgment
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericMessage' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/reset-password:
    post:
      tags: [Identity]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: Password changed; all existing sessions revoked
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        default: { $ref: '#/components/responses/Problem' }
  /profile:
    get:
      tags: [Profile]
      operationId: getProfile
      responses:
        '200':
          description: Current owned profile
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Profile]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        default: { $ref: '#/components/responses/Problem' }
  /preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      responses:
        '200':
          description: Current owned preferences
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Preferences]
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePreferencesRequest' }
      responses:
        '200':
          description: Updated preferences
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        default: { $ref: '#/components/responses/Problem' }
  /tracking-day/current:
    get:
      tags: [TrackingDay]
      operationId: getCurrentTrackingDay
      summary: Derive the caller's current nutrition day from Core-owned timezone and reset preferences
      responses:
        '200':
          description: Current Tracking Day and the UTC instant used to calculate it
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingDayContext' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/calculate:
    post:
      tags: [NutritionTargets]
      operationId: calculateNutritionTargets
      summary: Propose an FDA general benchmark for an adult account
      description: Values are general food-label references, not personalized recommendations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculateTargetRequest' }
      responses:
        '201':
          description: Versioned proposal awaiting review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets:
    get:
      tags: [NutritionTargets]
      operationId: getNutritionTargets
      responses:
        '200':
          description: Current active and proposed versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetSelection' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/history:
    get:
      tags: [NutritionTargets]
      operationId: listNutritionTargetHistory
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Cursor-paginated version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetHistoryPage' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/{id}/accept:
    post:
      tags: [NutritionTargets]
      operationId: acceptNutritionTargets
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptTargetRequest' }
      responses:
        '200':
          description: Activated version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetVersion' }
        default: { $ref: '#/components/responses/Problem' }
  /nutrition/targets/{id}/reject:
    post:
      tags: [NutritionTargets]
      operationId: rejectNutritionTargets
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '204': { description: Proposal rejected }
        default: { $ref: '#/components/responses/Problem' }
  /foods/search:
    get:
      tags: [Foods]
      operationId: searchUSDAFoods
      summary: Search local foods, explicitly discover USDA foods, or read account usage
      parameters:
        - { name: source, in: query, description: LOCAL searches imported foods without quota; USDA (default for compatibility) consumes one of 10 daily searches; STATUS returns usage without requiring q. Reset is midnight UTC., schema: { type: string, enum: [LOCAL, USDA, STATUS] } }
        - { name: q, in: query, description: Required except for STATUS., schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: food_state, in: query, schema: { type: string, enum: [RAW, COOKED, PREPARED, UNKNOWN] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated results and authenticated account usage. USDA exhaustion yields 429; provider failures yield 503 and refund the reservation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodSearchPage' }
        default: { $ref: '#/components/responses/Problem' }
  /foods/provider/{provider_food_id}:
    get:
      tags: [Foods]
      operationId: getUSDAFood
      parameters:
        - { name: provider_food_id, in: path, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200':
          description: Normalized USDA detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodResult' }
        default: { $ref: '#/components/responses/Problem' }
  /account/deletion-request:
    post:
      tags: [Identity]
      operationId: requestAccountDeletion
      summary: Verify a current local password, revoke sessions, and begin the 30-day deletion window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeletionRequest' }
      responses:
        '202':
          description: Account is deletion-pending; the refresh cookie is cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionStatus' }
        default: { $ref: '#/components/responses/Problem' }
  /account/deletion-request/google/start:
    get:
      tags: [Identity]
      operationId: startGoogleAccountDeletion
      summary: Start fresh Google re-authentication for an authenticated linked account
      responses:
        '200':
          description: One-time Google authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: { type: string, format: uri }
        default: { $ref: '#/components/responses/Problem' }
  /auth/cancel-deletion:
    post:
      tags: [Identity]
      operationId: cancelAccountDeletion
      security: []
      summary: Cancel a pending deletion using fresh local-password verification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelAccountDeletionRequest' }
      responses:
        '200':
          description: Account restored and a new session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/google/cancel-deletion/start:
    get:
      tags: [Identity]
      operationId: startGoogleDeletionCancellation
      security: []
      summary: Start fresh Google re-authentication to restore the matching pending account
      responses:
        '200':
          description: One-time Google authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: { type: string, format: uri }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Safe request correlation identifier; never carries personal data
      schema: { type: string }
  responses:
    Problem:
      description: API problem; status and code depend on the failure
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    MaintenancePlan:
      type: object
      required: [version, suggested_kcal, equation, unavailable_reason, profile_version, inputs, history, tracking_day]
      properties:
        version: { type: integer, minimum: 0 }
        suggested_kcal: { type: string }
        equation: { type: string }
        unavailable_reason: { type: string }
        profile_version: { type: integer, minimum: 0 }
        tracking_day: { type: string, format: date }
        inputs:
          type: object
          properties:
            height_cm: { type: string }
            weight_kg: { type: string }
            assumed_height: { type: boolean }
            assumed_weight: { type: boolean }
            age: { type: integer }
            sex: { type: string }
        history:
          type: array
          items:
            type: object
            properties:
              revision: { type: integer }
              kcal: { type: string }
              mode: { type: string, enum: [MANUAL, CALCULATED] }
              effective_from_tracking_day: { type: string, format: date }
              created_at: { type: string, format: date-time }
              equation: { type: string }
              height_cm: { type: string }
              weight_kg: { type: string }
              age: { type: integer }
              sex: { type: string }
    DailyWellness:
      type: object
      properties:
        tracking_day: { type: string, format: date }
        maintenance_kcal: { type: string }
        food_kcal: { type: string }
        workout_kcal: { type: string }
        calorie_deficit: { type: string, description: Signed decimal; positive deficit, negative surplus; empty when unavailable }
        water_ml: { type: string }
        workout_count: { type: integer, minimum: 0 }
        workouts_without_calories: { type: integer, minimum: 0 }
        workout_minutes: { type: string }
        maintenance_revision: { type: integer, minimum: 0 }
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password }
    CancelAccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AccountDeletionStatus:
      type: object
      required: [status, requested_at, purge_after]
      properties:
        status: { type: string, enum: [PENDING] }
        requested_at: { $ref: '#/components/schemas/UtcInstant' }
        purge_after: { $ref: '#/components/schemas/UtcInstant' }
    FoodNutrient:
      type: object
      required: [status, unit]
      properties:
        status: { type: string, enum: [KNOWN, UNKNOWN] }
        amount: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string }
    FoodResult:
      type: object
      required: [food_reference, name, food_state, base_quantity, nutrients, data_type, source_url]
      properties:
        food_reference:
          type: object
          required: [type, provider_food_id, custom_food_id]
          properties:
            type: { type: string, enum: [USDA] }
            provider_food_id: { type: string }
            custom_food_id: { type: string, nullable: true }
        name: { type: string }
        food_state: { type: string, enum: [RAW, COOKED, PREPARED, UNKNOWN] }
        base_quantity: { $ref: '#/components/schemas/Quantity' }
        nutrients:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FoodNutrient' }
        data_type: { type: string }
        source_url: { type: string, format: uri }
    FoodSearchPage:
      type: object
      required: [items, page, usage]
      properties:
        usage:
          type: object
          required: [usda_remaining, usda_limit, catalogue_count, matched_count, local_searches_today, resets_at]
          properties:
            usda_remaining: { type: integer, minimum: 0, maximum: 10 }
            usda_limit: { type: integer, enum: [10] }
            catalogue_count: { type: integer, minimum: 0 }
            matched_count: { type: integer, minimum: 0 }
            local_searches_today: { type: integer, minimum: 0 }
            resets_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/FoodResult' }
        page:
          type: object
          required: [next_cursor, has_more]
          properties:
            next_cursor: { type: string, nullable: true }
            has_more: { type: boolean }
    CalculateTargetRequest:
      type: object
      additionalProperties: false
      required: [profile_version, effective_from_tracking_day]
      properties:
        profile_version: { type: integer, minimum: 1 }
        effective_from_tracking_day: { type: string, format: date }
    SaveCustomTargetsRequest:
      type: object
      additionalProperties: false
      required: [expected_active_id, expected_revision, profile_version, changes]
      properties:
        expected_active_id: { type: string }
        expected_revision: { type: integer, minimum: 0 }
        profile_version: { type: integer, minimum: 1 }
        acknowledgement_token: { type: string, description: Signed ten-minute confirmation bound to exact owner, values, references and versions }
        energy_provenance: { type: string, enum: [CUSTOM, MACRO_DERIVED] }
        changes:
          type: object
          minProperties: 1
          maxProperties: 5
          additionalProperties:
            type: object
            required: [active_value]
            properties:
              active_value: { $ref: '#/components/schemas/Decimal' }
              override_reason: { type: string, maxLength: 200 }
    TargetReferenceRange:
      type: object
      nullable: true
      properties:
        minimum: { type: string }
        maximum: { type: string }
        energy_basis: { type: string }
        source_url: { type: string, format: uri }
        reference_revision: { type: string }
    CustomTargetWarning:
      type: object
      properties:
        nutrient: { type: string }
        selected_value: { type: string }
        unit: { type: string }
        reference_range: { $ref: '#/components/schemas/TargetReferenceRange' }
    CustomTargetsReview:
      type: object
      properties:
        warnings: { type: array, nullable: true, items: { $ref: '#/components/schemas/CustomTargetWarning' } }
        acknowledgement_token: { type: string }
    HealthOccurrence:
      type: object
      properties:
        occurrence_id: { type: string }
        health_item_id: { type: string }
        schedule_version: { type: integer }
        name: { type: string }
        type: { type: string, enum: [TASK, MEDICATION, SUPPLEMENT] }
        scheduled_at: { type: string, format: date-time, description: Effective UTC scheduled instant }
        original_scheduled_at: { type: string, format: date-time, nullable: true }
        event_version: { type: integer, minimum: 0 }
        status: { type: string, enum: [SCHEDULED, MISSED, TAKEN, SKIPPED] }
        completed_at: { type: string, format: date-time, nullable: true }
        rescheduled_to: { type: string, format: date-time, nullable: true }
        notes: { type: string }
        scheduled_local:
          type: object
          properties:
            date: { type: string, format: date }
            time: { type: string }
            timezone: { type: string }
    TargetInputs:
      type: object
      properties:
        height_cm: { type: string }
        weight_kg: { type: string }
        activity: { type: string }
        assumed_height: { type: boolean }
        assumed_weight: { type: boolean }
        assumed_activity: { type: boolean }
        age: { type: integer, minimum: 0 }
        sex: { type: string }
        profile_saved_at: { type: string }
    TargetPlanning:
      type: object
      properties:
        inputs: { $ref: '#/components/schemas/TargetInputs' }
        profile_version: { type: integer }
        policy_version: { type: string }
        personalized_enabled: { type: boolean }
        pending_decisions: { type: array, nullable: true, items: { type: string } }
        missing_inputs: { type: array, nullable: true, items: { type: string } }
        macro_calories: { type: string }
        rounding_tolerance_kcal: { type: string }
        explanation: { type: string }
        calculated_defaults:
          type: object
          nullable: true
          additionalProperties: { $ref: '#/components/schemas/Decimal' }
        energy_equation: { type: string }
        protein_rate: { type: string }
        activity_category: { type: string }
        reset_preview_token: { type: string }
        calculation_unavailable_reason: { type: string }
        calculated_warnings: { type: array, nullable: true, items: { $ref: '#/components/schemas/CustomTargetWarning' } }
    TargetValue:
      type: object
      additionalProperties: false
      required: [reference_value, active_value, unit, is_manual_override, override_reason]
      properties:
        reference_value: { $ref: '#/components/schemas/Decimal' }
        active_value: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string }
        is_manual_override: { type: boolean }
        provenance: { type: string }
        reference_range: { $ref: '#/components/schemas/TargetReferenceRange' }
        outside_reference: { type: boolean }
        acknowledged_at: { type: string }
        override_reason: { type: string }
    TargetVersion:
      type: object
      required: [id, revision, status, profile_version, reference_set, source_attribution, calculation_version, effective_from_tracking_day, target_basis, targets, created_at]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        revision: { type: integer, minimum: 1 }
        status: { type: string, enum: [PROPOSED, ACTIVE, REJECTED, SUPERSEDED] }
        profile_version: { type: integer, minimum: 1 }
        reference_set:
          type: object
          required: [key, version]
          properties:
            key: { type: string }
            version: { type: string }
        source_attribution:
          type: object
          required: [name, publisher, version, information_url]
          properties:
            name: { type: string }
            publisher: { type: string }
            version: { type: string }
            information_url: { type: string, format: uri }
        calculation_version: { type: string }
        effective_from_tracking_day: { type: string, format: date }
        target_basis: { type: string, enum: [GENERAL_BENCHMARK, PERSONALIZED_ESTIMATE] }
        targets:
          type: object
          additionalProperties: { $ref: '#/components/schemas/TargetValue' }
        created_at: { $ref: '#/components/schemas/UtcInstant' }
        reviewed_at: { $ref: '#/components/schemas/UtcInstant' }
        input_snapshot: { allOf: [{ $ref: '#/components/schemas/TargetInputs' }], nullable: true }
    TargetSelection:
      type: object
      required: [active, proposed]
      properties:
        active: { allOf: [{ $ref: '#/components/schemas/TargetVersion' }], nullable: true }
        proposed: { allOf: [{ $ref: '#/components/schemas/TargetVersion' }], nullable: true }
    AcceptTargetRequest:
      type: object
      additionalProperties: false
      required: [effective_from_tracking_day, overrides]
      properties:
        adult_scope_confirmed: { type: boolean, description: Required true for calculated proposal acceptance }
        effective_from_tracking_day: { type: string, format: date }
        overrides:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [active_value, override_reason]
            properties:
              active_value: { $ref: '#/components/schemas/Decimal' }
              override_reason: { type: string, minLength: 1 }
    TargetHistoryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TargetVersion' }
        page:
          type: object
          required: [next_cursor, has_more]
          properties:
            next_cursor: { type: string, nullable: true }
            has_more: { type: boolean }
    ObjectId:
      type: string
      pattern: '^[0-9a-f]{24}$'
    UtcInstant:
      type: string
      format: date-time
      description: RFC 3339 instant serialized in UTC
      example: '2026-09-28T02:30:00Z'
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Decimal string, never a JSON floating-point number
    Quantity:
      type: object
      additionalProperties: false
      required: [amount, unit]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        unit: { type: string, minLength: 1 }
    GenericMessage:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name, timezone]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, writeOnly: true, description: Server-side policy is configured with the identity service }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string, minLength: 1, example: Asia/Kolkata, description: IANA timezone name }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, writeOnly: true }
    VerifyEmailResponse:
      type: object
      additionalProperties: false
      required: [email_verified]
      properties:
        email_verified: { type: boolean, enum: [true] }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, writeOnly: true }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 1, writeOnly: true }
        new_password: { type: string, minLength: 1, writeOnly: true, description: Server-side policy is configured with the identity service }
    User:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, status]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        status: { type: string, enum: [ACTIVE, PENDING_EMAIL_VERIFICATION, DELETION_PENDING] }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in_seconds, user]
      properties:
        access_token: { type: string, minLength: 1 }
        token_type: { type: string, enum: [Bearer] }
        expires_in_seconds: { type: integer, minimum: 1, example: 900 }
        user: { $ref: '#/components/schemas/User' }
    Profile:
      type: object
      additionalProperties: false
      required: [id, version, display_name, timezone, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        onboarding_complete: { type: boolean, description: Completing or skipping the welcome guide persists per account. }
        version: { type: integer, minimum: 1 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, readOnly: true, description: Authenticated account email. }
        has_google_identity: { type: boolean, readOnly: true }
        date_of_birth: { type: string, format: date, nullable: true }
        sex: { type: string, nullable: true }
        height: { $ref: '#/components/schemas/Quantity' }
        weight: { $ref: '#/components/schemas/Quantity' }
        activity_level: { type: string, nullable: true }
        goal: { type: string, nullable: true }
        timezone: { type: string, minLength: 1, example: Asia/Kolkata }
        updated_at: { $ref: '#/components/schemas/UtcInstant' }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        onboarding_complete: { type: boolean, description: Completing or skipping the welcome guide persists per account. }
        version: { type: integer, minimum: 1 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        date_of_birth: { type: string, format: date, nullable: true }
        sex: { type: string, nullable: true }
        height: { $ref: '#/components/schemas/Quantity' }
        weight: { $ref: '#/components/schemas/Quantity' }
        activity_level: { type: string }
        goal: { type: string }
        timezone: { type: string, minLength: 1, example: Asia/Kolkata }
    Preferences:
      type: object
      additionalProperties: false
      required: [id, version, daily_reset_time, unit_system, dashboard_nutrients, analysis_health_item_ids]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        version: { type: integer, minimum: 1 }
        daily_reset_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '04:00' }
        unit_system: { type: string, enum: [METRIC, IMPERIAL] }
        dashboard_nutrients:
          type: array
          description: Application-wide tracked nutrients for logging, Dashboard, Analysis and summaries. Energy remains included; source data is retained in full.
          uniqueItems: true
          maxItems: 49
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        analysis_health_item_ids:
          type: array
          maxItems: 12
          uniqueItems: true
          description: Owner-selected health items charted in Analysis. Empty means no charts; paused items may be selected.
          items: { $ref: '#/components/schemas/ObjectId' }
    TrackingDayContext:
      type: object
      additionalProperties: false
      required: [tracking_day, timezone, daily_reset_time, rule_version, as_of_utc]
      properties:
        tracking_day: { type: string, format: date }
        timezone: { type: string, example: Asia/Kolkata }
        daily_reset_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        rule_version: { type: integer, minimum: 1 }
        as_of_utc: { $ref: '#/components/schemas/UtcInstant' }
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        daily_reset_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        unit_system: { type: string, enum: [METRIC, IMPERIAL] }
        dashboard_nutrients:
          type: array
          description: Replaces the tracked nutrient selection. Requires ENERGY and distinct supported codes; omission preserves the saved selection.
          uniqueItems: true
          minItems: 1
          maxItems: 49
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        analysis_health_item_ids:
          type: array
          maxItems: 12
          uniqueItems: true
          description: Replaces only this selection, including intentional empty lists; IDs must belong to the authenticated account. Omission preserves it. Uses the shared preferences version for conflict detection.
          items: { $ref: '#/components/schemas/ObjectId' }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400 }
        code: { type: string, pattern: '^[A-Z][A-Z_]*$' }
        detail: { type: string }
        request_id: { type: string }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
