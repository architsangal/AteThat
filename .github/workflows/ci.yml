name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    name: Web build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
      - name: Frontend regression tests
        run: node --experimental-strip-types --test apps/web/src/features/*.test.mjs apps/web/src/features/nutrition/model.test.mjs apps/web/src/features/wellness/schedule-model.test.mjs

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test API
        working-directory: services/api
        run: go test ./...
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name test-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test Core
        working-directory: services/core
        env:
          ATETHAT_TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
        run: go test ./...

  production-config:
    name: Production Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: |
          cp deploy/production/.env.example deploy/production/.env
          docker compose -f deploy/production/compose.yaml config --quiet
          rm deploy/production/.env
